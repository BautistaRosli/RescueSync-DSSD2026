apiVersion: v1
kind: Service
metadata:
  name: rescuesync-prioridad-svc
  namespace: rescuesync
  labels:
    app: rescuesync-prioridad
spec:
  # NodePort para que el ecosistema local (backend/frontend) consuma el
  # servicio en http://localhost:30080. Internamente sigue siendo un único
  # Service para todas las réplicas.
  type: NodePort
  selector:
    app: rescuesync-prioridad
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
